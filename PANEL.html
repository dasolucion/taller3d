<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-white"><i class="fa-solid fa-chart-line text-emerald-400 mr-2"></i> Panel de Gestión</h1>
            <button onclick="fetchAllData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition border border-slate-700">
                <i class="fa-solid fa-rotate mr-1"></i> Actualizar Datos
            </button>
        </header>

        <!-- Contenedor Principal (Ejemplo simplificado de secciones) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Sección de Ventas Rápida -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-white"><i class="fa-solid fa-cash-register text-emerald-400 mr-2"></i> Ventas</h2>
                    <button onclick="venderDesdeCatalogo()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                        <i class="fa-solid fa-plus mr-1"></i> Nueva Venta
                    </button>
                </div>
                <div id="ventas-container" class="space-y-3 text-sm text-slate-300">
                    <!-- Los datos se cargarán aquí dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Venta -->
    <div id="modal-venta" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-lg w-full p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-ven-title" class="text-base font-bold text-white">Registrar Venta</h3>
                <button onclick="closeModal('modal-venta')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="ven-edit-id">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Cliente</label>
                    <input type="text" id="ven-cliente" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white outline-none focus:border-emerald-500" placeholder="Nombre del cliente">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-medium text-slate-400">Productos</label>
                        <button type="button" onclick="agregarFilaProductoVenta()" class="text-xs text-emerald-400 hover:underline"><i class="fa-solid fa-plus mr-1"></i> Agregar otro</button>
                    </div>
                    <div id="ven-productos-container" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <!-- Filas de productos inyectadas por JS -->
                    </div>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-slate-800">
                    <span class="text-sm font-medium text-slate-300">Total:</span>
                    <input type="text" id="ven-total" class="w-32 bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm text-emerald-400 font-bold text-right outline-none" readonly value="0.00">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button onclick="closeModal('modal-venta')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm">Cancelar</button>
                <button onclick="guardarVenta()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium">Guardar Venta</button>
            </div>
        </div>
    </div>

    <!-- Notificaciones Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-2xl hidden transition-all duration-300 z-50 text-sm"></div>

    <!-- Script de lógica de la aplicación -->
    <script>
        // Configuración de Supabase (Reemplaza con tus credenciales)
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_KEY = 'TU_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let appData = {
            catalogo: [],
            ventas: [],
            muestras: [],
            prospectos: [],
            tareas: []
        };

        // Utilidades de modales y alertas
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function showToast(mensaje, tipo = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = mensaje;
            toast.className = `fixed bottom-5 right-5 px-4 py-3 rounded-xl shadow-2xl z-50 text-sm border ${tipo === 'error' ? 'bg-red-950 border-red-800 text-red-200' : 'bg-slate-800 border-slate-700 text-white'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        async function fetchAllData() {
            // Función simulada para refrescar datos desde Supabase
            showToast('Actualizando datos...');
        }

        // ==================== GESTIÓN DE VENTAS Y PRODUCTOS ====================
        function agregarFilaProductoVenta(prodId = '', cant = 1, initialPrice = 0) {
            const container = document.getElementById('ven-productos-container');
            const rowId = `ven-row-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
            
            let optionsHtml = '<option value="">Seleccionar producto...</option>';
            appData.catalogo.forEach(c => {
                const selected = c.id === prodId ? 'selected' : '';
                optionsHtml += `<option value="${c.id}" ${selected}>${c.producto} ($${c.precio})</option>`;
            });

            if (!initialPrice && prodId) {
                const prod = appData.catalogo.find(c => c.id === prodId);
                if (prod) initialPrice = prod.precio;
            }

            const rowHtml = `
                <div id="${rowId}" class="ven-prod-row flex items-center space-x-2 bg-slate-950/50 p-2 rounded-lg border border-slate-800">
                    <select class="ven-prod-select flex-1 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none focus:border-sky-500" onchange="actualizarPrecioFilaVenta(this)">
                        ${optionsHtml}
                    </select>
                    <input type="number" class="ven-prod-cant w-16 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-white outline-none focus:border-sky-500" value="${cant}" min="1" oninput="calcularTotalVenta()">
                    <input type="number" step="0.01" class="ven-prod-precio w-24 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-emerald-400 outline-none focus:border-emerald-500" value="${initialPrice}" oninput="calcularTotalVenta()">
                    <button type="button" onclick="eliminarFilaProductoVenta('${rowId}')" class="text-slate-500 hover:text-red-400 p-1.5 text-xs"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', rowHtml);
            calcularTotalVenta();
        }

        function actualizarPrecioFilaVenta(selectEl) {
            const row = selectEl.closest('.ven-prod-row');
            const prodId = selectEl.value;
            const prod = appData.catalogo.find(c => c.id === prodId);
            if (prod) {
                row.querySelector('.ven-prod-precio').value = prod.precio;
            }
            calcularTotalVenta();
        }

        function eliminarFilaProductoVenta(rowId) {
            const row = document.getElementById(rowId);
            if (row && document.querySelectorAll('.ven-prod-row').length > 1) {
                row.remove();
                calcularTotalVenta();
            }
        }

        function calcularTotalVenta() {
            let total = 0;
            document.querySelectorAll('.ven-prod-row').forEach(row => {
                const cant = parseFloat(row.querySelector('.ven-prod-cant').value) || 0;
                const precio = parseFloat(row.querySelector('.ven-prod-precio').value) || 0;
                total += cant * precio;
            });
            document.getElementById('ven-total').value = total.toFixed(2);
        }

        function venderDesdeCatalogo(prodId = '') {
            document.getElementById('ven-edit-id').value = "";
            document.getElementById('modal-ven-title').innerHTML = '<i class="fa-solid fa-cart-plus text-emerald-400 mr-2"></i> Registrar Nueva Venta';
            document.getElementById('ven-cliente').value = '';
            document.getElementById('ven-productos-container').innerHTML = '';
            agregarFilaProductoVenta(prodId, 1);
            openModal('modal-venta');
        }

        function editarVenta(id) {
            const v = appData.ventas.find(x => x.id === id);
            if (!v) return;
            document.getElementById('ven-edit-id').value = v.id;
            document.getElementById('modal-ven-title').innerHTML = '<i class="fa-solid fa-pen-to-square text-emerald-400 mr-2"></i> Editar Venta';
            document.getElementById('ven-cliente').value = v.cliente;
            
            document.getElementById('ven-productos-container').innerHTML = '';
            if (v.items && v.items.length > 0) {
                v.items.forEach(i => {
                    const prod = appData.catalogo.find(c => c.producto === i.producto);
                    const prodId = prod ? prod.id : null;
                    agregarFilaProductoVenta(prodId, i.cant, i.precioUnit);
                });
            } else {
                agregarFilaProductoVenta();
            }
            openModal('modal-venta');
        }

        async function guardarVenta() {
            const id = document.getElementById('ven-edit-id').value || `V-${Date.now()}`;
            const cliente = document.getElementById('ven-cliente').value;
            const esNuevaVenta = !document.getElementById('ven-edit-id').value;
            
            if (!cliente) return alert('Ingresa el nombre del cliente');

            let items = [];
            let total = 0;
            let costoTotalVenta = 0;

            document.querySelectorAll('.ven-prod-row').forEach(row => {
                const select = row.querySelector('.ven-prod-select');
                const prodId = select.value;
                const prod = appData.catalogo.find(c => c.id === prodId);
                const nombreProd = prod ? prod.producto : select.options[select.selectedIndex].text.split(' ($')[0];
                const costoUnit = prod ? prod.costo : 0;
                
                const cant = parseFloat(row.querySelector('.ven-prod-cant').value) || 0;
                const precio = parseFloat(row.querySelector('.ven-prod-precio').value) || 0;
                
                items.push({ producto: nombreProd, cant: cant, precioUnit: precio });
                total += cant * precio;
                costoTotalVenta += cant * costoUnit;
            });

            if (esNuevaVenta && typeof procesarConsumoMaterial === 'function') {
                for (const item of items) {
                    await procesarConsumoMaterial(item.producto, item.cant);
                }
            }

            const payload = {
                id,
                fecha: new Date().toISOString().split('T')[0],
                cliente,
                items,
                total,
                costo: costoTotalVenta
            };

            const { error } = await supabaseClient.from('ventas').upsert(payload);
            if (!error) {
                showToast('Venta registrada con éxito');
                closeModal('modal-venta');
                await fetchAllData();
            } else {
                showToast('Error al registrar venta', 'error');
            }
        }

        async function eliminarVenta(id) {
            if (confirm('¿Eliminar esta venta?')) {
                const { error } = await supabaseClient.from('ventas').delete().eq('id', id);
                if (!error) {
                    showToast('Venta eliminada');
                    await fetchAllData();
                }
            }
        }
    </script>
</body>
</html>
